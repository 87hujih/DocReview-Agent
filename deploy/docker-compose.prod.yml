services:
  server:
    image: ${IMAGE_REGISTRY}/${IMAGE_NAMESPACE}/docreview-agent-server:${IMAGE_TAG}
    restart: unless-stopped
    networks:
      - agent-net
    ports:
      - "${SERVER_PORT}:8080"
    environment:
      PORT: "8080"
      DATABASE_URL: "${DATABASE_URL}"
      SILICONFLOW_API_KEY: "${SILICONFLOW_API_KEY}"
      SILICONFLOW_BASE_URL: "${SILICONFLOW_BASE_URL}"
      LLM_MODEL: "${LLM_MODEL}"
      EMBEDDING_MODEL: "${EMBEDDING_MODEL}"
      EMBEDDING_DIM: "${EMBEDDING_DIM}"
      RERANKER_MODEL: "${RERANKER_MODEL}"
      LOG_LEVEL: "${LOG_LEVEL}"
      LOG_FORMAT: "${LOG_FORMAT}"
      LOG_ADD_SOURCE: "${LOG_ADD_SOURCE}"

  web:
    image: ${IMAGE_REGISTRY}/${IMAGE_NAMESPACE}/docreview-agent-web:${IMAGE_TAG}
    restart: unless-stopped
    networks:
      - agent-net
    depends_on:
      - server
    ports:
      - "${WEB_PORT}:3000"
    environment:
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      # NEXT_PUBLIC_API_URL 必须是浏览器可访问的公网后端地址
      # 本地开发: http://127.0.0.1:18080
      # 云服务器初期: http://<server-ip>:8080（不能写容器内 service name 或服务器本机的 127.0.0.1）
      NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL}"

networks:
  agent-net:
    external: true
