services:
  server:
    image: ghcr.io/${GHCR_OWNER}/docreview-agent-server:${IMAGE_TAG}
    restart: unless-stopped
    networks:
      - agent-net
    ports:
      - "${SERVER_PORT}:8080"
    environment:
      PORT: "8080"
      DATABASE_URL: "${DATABASE_URL}"
      SILICONFLOW_API_KEY: "${SILICONFLOW_API_KEY}"
      SILICONFLOW_BASE_URL: "${SILICONFLOW_BASE_URL}"
      LLM_MODEL: "${LLM_MODEL}"
      EMBEDDING_MODEL: "${EMBEDDING_MODEL}"
      EMBEDDING_DIM: "${EMBEDDING_DIM}"
      RERANKER_MODEL: "${RERANKER_MODEL}"
      LOG_LEVEL: "${LOG_LEVEL}"
      LOG_FORMAT: "${LOG_FORMAT}"
      LOG_ADD_SOURCE: "${LOG_ADD_SOURCE}"

  web:
    image: ghcr.io/${GHCR_OWNER}/docreview-agent-web:${IMAGE_TAG}
    restart: unless-stopped
    networks:
      - agent-net
    depends_on:
      - server
    ports:
      - "${WEB_PORT}:3000"
    environment:
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      NEXT_PUBLIC_API_BASE_URL: "${NEXT_PUBLIC_API_BASE_URL}"

networks:
  agent-net:
    external: true
