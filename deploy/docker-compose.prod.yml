services:
  migrate:
    image: ${IMAGE_REGISTRY}/${IMAGE_NAMESPACE}/docreview-agent-server:${IMAGE_TAG}
    restart: "no"
    networks:
      - agent-net
    environment:
      DATABASE_URL: "${DATABASE_URL}"
    entrypoint: ["./migrate"]

  server:
    image: ${IMAGE_REGISTRY}/${IMAGE_NAMESPACE}/docreview-agent-server:${IMAGE_TAG}
    restart: unless-stopped
    networks:
      - agent-net
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      # 只有宿主机本地且受保护的反向代理可以访问后端端口。
      - "127.0.0.1:${SERVER_PORT}:8080"
    environment:
      APP_ENV: "production"
      PORT: "8080"
      DATABASE_URL: "${DATABASE_URL}"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS}"
      SILICONFLOW_API_KEY: "${SILICONFLOW_API_KEY}"
      SILICONFLOW_BASE_URL: "${SILICONFLOW_BASE_URL}"
      LLM_MODEL: "${LLM_MODEL}"
      EMBEDDING_MODEL: "${EMBEDDING_MODEL}"
      EMBEDDING_DIM: "${EMBEDDING_DIM}"
      RERANKER_MODEL: "${RERANKER_MODEL}"
      AGENT_RUNTIME_MODE: "${AGENT_RUNTIME_MODE:-durable}"
      AGENT_RUNTIME_TRUSTED_INGRESS_HMAC_SECRET: "${AGENT_RUNTIME_TRUSTED_INGRESS_HMAC_SECRET:-}"
      AGENT_RUNTIME_TRUSTED_INGRESS_SOURCE: "${AGENT_RUNTIME_TRUSTED_INGRESS_SOURCE:-}"
      AGENT_RUNTIME_TRUSTED_INGRESS_MAX_AGE_MS: "${AGENT_RUNTIME_TRUSTED_INGRESS_MAX_AGE_MS:-300000}"
      LOG_LEVEL: "${LOG_LEVEL}"
      LOG_FORMAT: "${LOG_FORMAT}"
      LOG_ADD_SOURCE: "${LOG_ADD_SOURCE}"

  web:
    image: ${IMAGE_REGISTRY}/${IMAGE_NAMESPACE}/docreview-agent-web:${IMAGE_TAG}
    restart: unless-stopped
    networks:
      - agent-net
    depends_on:
      - server
    ports:
      - "${WEB_PORT}:3000"
    environment:
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      # 公网流量必须通过受保护的反向代理进入，禁止直接暴露后端端口。
      NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL}"

networks:
  agent-net:
    external: true
