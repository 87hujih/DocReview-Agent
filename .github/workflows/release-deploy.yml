name: Release Deploy

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Existing image tag to deploy or roll back to"
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/server/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/docreview-agent-server:${{ github.ref_name }}

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: apps/web
          file: apps/web/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/docreview-agent-web:${{ github.ref_name }}

  deploy:
    needs: build-and-push
    if: always() && (needs.build-and-push.result == 'success' || needs.build-and-push.result == 'skipped')
    runs-on: ubuntu-latest
    env:
      IMAGE_TAG: ${{ github.event_name == 'push' && github.ref_name || github.event.inputs.image_tag }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Add server to known hosts
        run: ssh-keyscan -p ${{ secrets.DEPLOY_PORT }} ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts

      - name: Prepare remote directory
        run: ssh -p ${{ secrets.DEPLOY_PORT }} ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} mkdir -p /opt/agent-project

      - name: Copy compose file to server
        run: scp -P ${{ secrets.DEPLOY_PORT }} deploy/docker-compose.prod.yml ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/opt/agent-project/docker-compose.prod.yml

      - name: Transfer server image
        run: |
          docker pull "ghcr.io/${{ github.repository_owner }}/docreview-agent-server:${{ env.IMAGE_TAG }}"
          docker save "ghcr.io/${{ github.repository_owner }}/docreview-agent-server:${{ env.IMAGE_TAG }}" \
            | gzip -1 \
            | ssh -p ${{ secrets.DEPLOY_PORT }} ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} "gunzip | docker load"

      - name: Transfer web image
        run: |
          docker pull "ghcr.io/${{ github.repository_owner }}/docreview-agent-web:${{ env.IMAGE_TAG }}"
          docker save "ghcr.io/${{ github.repository_owner }}/docreview-agent-web:${{ env.IMAGE_TAG }}" \
            | gzip -1 \
            | ssh -p ${{ secrets.DEPLOY_PORT }} ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} "gunzip | docker load"

      - name: Run database migrations
        run: |
          ssh -p ${{ secrets.DEPLOY_PORT }} ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "IMAGE_TAG=${{ env.IMAGE_TAG }} GHCR_OWNER=${{ github.repository_owner }} \
            docker compose -f /opt/agent-project/docker-compose.prod.yml --env-file /opt/agent-project/.env run --rm migrate"

      - name: Start containers
        run: |
          ssh -p ${{ secrets.DEPLOY_PORT }} ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "IMAGE_TAG=${{ env.IMAGE_TAG }} GHCR_OWNER=${{ github.repository_owner }} \
            docker compose -f /opt/agent-project/docker-compose.prod.yml --env-file /opt/agent-project/.env up -d --no-deps server web"

      - name: Verify server health
        run: |
          ssh -p ${{ secrets.DEPLOY_PORT }} ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} "
            for attempt in \$(seq 1 12); do
              if curl -fsS http://127.0.0.1:8080/healthz >/dev/null; then
                echo 'Server health check passed'
                exit 0
              fi
              sleep 5
            done
            echo 'Server health check failed' >&2
            exit 1
          "

      - name: Verify web health
        run: |
          ssh -p ${{ secrets.DEPLOY_PORT }} ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} "
            for attempt in \$(seq 1 12); do
              if curl -fsS http://127.0.0.1:3000 >/dev/null; then
                echo 'Web health check passed'
                exit 0
              fi
              sleep 5
            done
            echo 'Web health check failed' >&2
            exit 1
          "

      - name: Show remote diagnostics on failure
        if: failure()
        run: |
          ssh -p ${{ secrets.DEPLOY_PORT }} ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} "
            docker ps --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}' || true
            echo '=== COMPOSE ==='
            cd /opt/agent-project && docker compose -f docker-compose.prod.yml --env-file .env ps || true
            echo '=== SERVER LOGS ==='
            docker logs --tail 50 agent-project-server-1 || true
            echo '=== WEB LOGS ==='
            docker logs --tail 50 agent-project-web-1 || true
          "
