name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  server-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agent_project_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run offline Agent Runtime evaluation
        run: >-
          go run ./apps/server/cmd/agent-eval
          -dataset apps/server/internal/agent/evaluation/testdata/agent_runtime_eval_v1.json
          -candidate apps/server/internal/agent/evaluation/testdata/agent_runtime_candidate_v1.json
          -report "$RUNNER_TEMP/agent-runtime-eval-report.json"

      - name: Upload Agent Runtime evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-runtime-eval-report
          path: ${{ runner.temp }}/agent-runtime-eval-report.json
          if-no-files-found: error

      - name: Run server tests
        run: go test ./apps/server/...
        env:
          ALLOW_DB_TESTS: "1"
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/agent_project_test?sslmode=disable
          TEST_DATABASE_HOST_ALLOWLIST: localhost

  web-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run web tests
        run: npm test -- --run

      - name: Run web lint
        run: npm run lint

  web-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

  build-images:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build server image
        run: docker build -f apps/server/Dockerfile -t docreview-agent-server:ci .

      - name: Build web image
        run: docker build -f apps/web/Dockerfile -t docreview-agent-web:ci apps/web
