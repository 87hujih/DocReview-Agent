name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  server-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run server tests
        run: go test ./apps/server/...

  web-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install web dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

  image-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build server image
        run: docker build -f apps/server/Dockerfile -t docreview-agent-server:ci .

      - name: Build web image
        run: docker build -f apps/web/Dockerfile -t docreview-agent-web:ci apps/web
